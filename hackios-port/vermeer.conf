# Device profile: sourced by common/build.sh and common/run.sh.
# Xiaomi Redmi K70 (vermeer, SM8550-AB) — values read from the phone's vendor_boot DTB
# and from our own Mu-Silicium port (see docs/11-HackiOS移植对照.md).

NAME="Xiaomi Redmi K70 (vermeer)"
KIND=phone
SOC="Qualcomm SM8550-AB"

# --- boot chain -------------------------------------------------------------------------------------
# Our UEFI port builds with build_uefi.py -d vermeer; fastboot-booted, nothing flashed.
UEFI_TARGET=vermeer
UEFI_FD=                              # empty: Mu-Silicium/Build/vermeerPkg/.../SILICIUM_UEFI.fd
DTB=D:\本地项目-01\_k70port_extract\port\Resources\DTBs\vermeer.dtb   # single FDT, 808716 B
FD_BASE=0xA7100000                    # from Resources/Configs/vermeer.toml [uefi_fd]
FD_SIZE=0x400000                      # 4 MiB FD (keys12 onwards)
PAYLOAD_BASE=0x90000000               # 64 MiB window inside our free DRAM 0x80000000-0xB7FFFFFF

# --- kernel and loader ------------------------------------------------------------------------------
FB_BASE=0xB8000000                    # GOP framebuffer our SimpleFbDxe reports (1440x3200)
WIFI_ATH11K=0

# --- what the run needs -----------------------------------------------------------------------------
BOOTARGS="touchscreen=0 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
